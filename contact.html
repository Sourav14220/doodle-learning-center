<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doodle Learning Center | Contact Us</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <header role="banner">
    <div class="header-container">
      <div class="logo-area">
        <img src="images/logo-thumb.png" alt="Doodle Learning Center Logo" class="logo-img">
        <h1>Doodle Learning Center</h1>
      </div>
      <nav role="navigation" aria-label="Main Navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="courses.html">Courses</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="media.html">Visual Hub</a></li>
          <li><a href="contact.html" class="active">Contact Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main role="main">
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading" class="section-title">Get in Touch</h2>
      <p class="section-subtitle">Have questions about our courses or platform? Send us a message below.</p>

      <div class="form-container">
        <form id="contactForm" novalidate>
          
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
            <span class="error-message" id="nameError"></span>
          </div>

          <div class="form-group">
            <label for="emailAddress">Email Address *</label>
            <input type="email" id="emailAddress" name="emailAddress" required placeholder="john@example.com">
            <span class="error-message" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="subject">Inquiry Type</label>
            <select id="subject" name="subject">
              <option value="general">General Information</option>
              <option value="enrollment">Course Enrollment</option>
              <option value="technical">Technical Support</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="5" required placeholder="How can we help you?"></textarea>
            <span class="error-message" id="messageError"></span>
          </div>

          <button type="submit" class="btn-submit">Send Message</button>
          
          <div id="formFeedback" role="status"></div>
        </form>
      </div>
    </section>
  </main>

  <footer role="contentinfo">
    <div class="footer-content">
      <p>&copy; 2026 Doodle Learning Center. All rights reserved.</p>
      <div class="social-links">
        <a href="#" aria-label="Twitter">Twitter</a>
        <a href="#" aria-label="LinkedIn">LinkedIn</a>
        <a href="#" aria-label="YouTube">YouTube</a>
      </div>
    </div>
  </footer>

</body>
</html>
